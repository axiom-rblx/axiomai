<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Axiom — page not found.">
  <title>404 — Axiom</title>

  <style>
    :root{
      color-scheme:light;
      --bg:#fbfaf7;
      --surface:#fffefa;
      --surface-2:#f4f1ea;
      --ink:#292621;
      --muted:#777168;
      --line:#dedad1;
      --blue:#4d78f6;
      --blue-soft:#edf2ff;
      --shadow:0 18px 60px rgba(50,41,28,.08);
    }

    @media (prefers-color-scheme:dark){
      :root{
        color-scheme:dark;
        --bg:#171716;
        --surface:#1e1d1a;
        --surface-2:#25231f;
        --ink:#f1efe8;
        --muted:#aaa49a;
        --line:#393630;
        --blue:#8ba9ff;
        --blue-soft:#252b3a;
        --shadow:0 18px 60px rgba(0,0,0,.35);
      }
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(
          circle at 50% -10%,
          color-mix(in srgb,var(--blue) 9%,transparent),
          transparent 34rem
        ),
        var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .card{
      width:min(100%,560px);
      text-align:center;
    }

    .logo{
      width:38px;
      height:38px;
      object-fit:contain;
      margin-bottom:28px;
    }

    .icon-wrap{
      width:86px;
      height:86px;
      margin:0 auto 26px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--surface);
      box-shadow:var(--shadow);
      color:var(--blue);
    }

    .outage-icon{
      width:44px;
      height:44px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .code{
      margin:0 0 10px;
      color:var(--blue);
      font-size:12px;
      font-weight:800;
      letter-spacing:.11em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif;
      font-size:clamp(52px,10vw,78px);
      line-height:.98;
      letter-spacing:-3.5px;
      font-weight:500;
    }

    .copy{
      max-width:430px;
      margin:18px auto 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.7;
    }

    .actions{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      flex-wrap:wrap;
      margin-top:30px;
    }

    .button{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 15px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
      color:var(--ink);
      text-decoration:none;
      font:inherit;
      font-size:13px;
      font-weight:650;
      cursor:pointer;
      transition:transform .15s ease,background .15s ease,border-color .15s ease;
    }

    .button:hover{
      transform:translateY(-1px);
      background:var(--surface-2);
      border-color:color-mix(in srgb,var(--muted) 50%,var(--line));
    }

    .button.primary{
      background:var(--blue);
      border-color:var(--blue);
      color:white;
    }

    .button.primary:hover{
      background:color-mix(in srgb,var(--blue) 88%,black);
    }

    .foot{
      margin-top:34px;
      color:var(--muted);
      font-size:11px;
    }

    @media(max-width:480px){
      .icon-wrap{
        width:76px;
        height:76px;
        border-radius:22px;
      }

      .outage-icon{
        width:39px;
        height:39px;
      }

      h1{
        font-size:58px;
        letter-spacing:-2.8px;
      }

      .copy{
        font-size:14px;
      }

      .actions{
        flex-direction:column;
      }

      .button{
        width:100%;
      }
    }

    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="/content.png" alt="Axiom">

    <div class="icon-wrap" aria-hidden="true">
      <svg class="outage-icon" viewBox="0 0 48 48">
        <path d="M8 18c4.3-4 9.8-6 16-6s11.7 2 16 6"></path>
        <path d="M13.5 24.5C16.4 21.7 20 20 24 20c4 0 7.6 1.7 10.5 4.5"></path>
        <path d="M19 31c1.4-1.4 3.1-2 5-2s3.6.6 5 2"></path>
        <circle cx="24" cy="38" r="1.5"></circle>
        <path d="M9 9l30 30"></path>
      </svg>
    </div>

    <p class="code">Error 404</p>
    <h1>Uh Oh!</h1>

    <p class="copy">
      This page doesn't exist, moved somewhere else, or got disconnected from Axiom.
    </p>

    <div class="actions">
      <a class="button primary" href="/">Back to Axiom</a>
      <button class="button" type="button" onclick="location.reload()">Try again</button>
    </div>

    <p class="foot">axiomai.technology</p>
  </main>
</body>
</html>
