<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Axiom — page not found.">
  <meta name="robots" content="noindex">
  <title>Page not found — Axiom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M9 22 15.7 8h2.6L25 22h-4l-1.2-3H14l-1.2 3H9Zm6.2-6h3.6L17 11.5 15.2 16Z' fill='white'/%3E%3C/svg%3E">

  <style>
    :root{
      color-scheme:light;
      --bg:#f8fafc;
      --surface:#ffffff;
      --soft:#eef2f7;
      --ink:#172033;
      --muted:#667085;
      --line:#dde3eb;
      --blue:#2563eb;
      --blue-hover:#1d4ed8;
      --blue-soft:#eaf1ff;
      --ring:#79a7ff;
      --danger:#c2414e;
      --shadow:0 24px 70px rgba(24,34,51,.10);
    }

    @media(prefers-color-scheme:dark){
      :root{
        color-scheme:dark;
        --bg:#11151c;
        --surface:#181e27;
        --soft:#202733;
        --ink:#eef2f7;
        --muted:#a3afbf;
        --line:#303947;
        --blue:#84adff;
        --blue-hover:#a7c5ff;
        --blue-soft:#1d2d49;
        --ring:#78a5ff;
        --danger:#ff9aa5;
        --shadow:0 26px 80px rgba(0,0,0,.32);
      }
    }

    *{box-sizing:border-box}

    html{min-width:320px;background:var(--bg)}

    body{
      margin:0;
      min-height:100dvh;
      padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,a{font:inherit}

    a,button{-webkit-tap-highlight-color:transparent}

    :focus-visible{
      outline:3px solid var(--ring);
      outline-offset:3px;
    }

    .page{
      width:min(1120px,100%);
      min-height:calc(100dvh - max(48px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      margin:auto;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    .brand{
      width:max-content;
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--ink);
      text-decoration:none;
      font-size:20px;
      font-weight:750;
      letter-spacing:-.6px;
    }

    .brand-mark{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      border-radius:9px;
      background:var(--blue);
      color:white;
      box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 22%,transparent);
    }

    .brand-mark svg{width:20px;height:20px}

    .brand-dot{color:var(--blue)}

    .content{
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(360px,.8fr);
      align-items:center;
      gap:clamp(48px,8vw,112px);
      padding:64px 0;
    }

    .copy-block{max-width:610px}

    .error-code{
      margin:0 0 14px;
      color:var(--blue);
      font:700 12px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      max-width:580px;
      margin:0;
      font-size:clamp(46px,6vw,76px);
      line-height:1.02;
      letter-spacing:-3.6px;
      font-weight:680;
    }

    .lead{
      max-width:520px;
      margin:22px 0 0;
      color:var(--muted);
      font-size:clamp(15px,1.4vw,17px);
      line-height:1.7;
    }

    .missing-route{
      width:min(100%,520px);
      margin:26px 0 0;
      display:flex;
      align-items:center;
      gap:10px;
      padding:11px 13px;
      border-left:3px solid var(--blue);
      background:var(--soft);
      color:var(--muted);
      font-size:12px;
      overflow:hidden;
    }

    .missing-route span{flex:0 0 auto}

    .missing-route code{
      min-width:0;
      color:var(--ink);
      font:600 12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:30px;
    }

    .button{
      min-height:46px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:0 18px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface);
      color:var(--ink);
      text-decoration:none;
      font-size:14px;
      font-weight:650;
      cursor:pointer;
      transition:background-color .16s ease,border-color .16s ease,transform .16s ease;
    }

    .button:hover{
      background:var(--soft);
      border-color:color-mix(in srgb,var(--muted) 45%,var(--line));
      transform:translateY(-1px);
    }

    .button.primary{
      border-color:var(--blue);
      background:var(--blue);
      color:white;
    }

    .button.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}

    .button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .route-map{
      min-height:390px;
      position:relative;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:24px;
      background:var(--surface);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .route-map::before,.route-map::after{
      content:"";
      position:absolute;
      background:var(--line);
    }

    .route-map::before{width:1px;height:100%;left:28%}
    .route-map::after{width:100%;height:1px;top:72%}

    .map-svg{width:min(82%,360px);height:auto;position:relative;z-index:1}

    .map-line{fill:none;stroke:var(--line);stroke-width:2}
    .map-line.active{stroke:var(--blue)}
    .map-line.lost{stroke:var(--danger);stroke-dasharray:5 7}
    .map-node{fill:var(--surface);stroke:var(--line);stroke-width:2}
    .map-node.active{fill:var(--blue);stroke:var(--blue)}
    .map-node.lost{fill:var(--surface);stroke:var(--danger)}
    .map-label{fill:var(--muted);font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em}
    .map-label.strong{fill:var(--ink)}

    .map-caption{
      position:absolute;
      left:24px;
      right:24px;
      bottom:20px;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      color:var(--muted);
      font-size:11px;
    }

    .map-caption strong{color:var(--ink);font-weight:650}

    .status{
      min-height:20px;
      margin:18px 0 0;
      color:var(--muted);
      font-size:12px;
    }

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding-top:20px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
    }

    .footer a{color:inherit;text-underline-offset:3px}

    html[data-routing="true"] .content{opacity:.55;pointer-events:none}
    html[data-routing="true"] .status{color:var(--blue)}

    @media(max-width:820px){
      .page{min-height:calc(100dvh - 48px)}
      .content{grid-template-columns:1fr;gap:42px;padding:56px 0}
      .copy-block{max-width:640px}
      .route-map{min-height:280px;width:min(100%,620px)}
      .map-svg{width:min(72%,360px)}
    }

    @media(max-width:520px){
      body{padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
      .brand{font-size:18px}
      .brand-mark{width:30px;height:30px}
      .content{padding:44px 0 40px;gap:34px}
      h1{font-size:clamp(42px,13vw,58px);letter-spacing:-2.5px}
      .lead{margin-top:18px}
      .missing-route{margin-top:22px}
      .actions{display:grid;grid-template-columns:1fr;margin-top:26px}
      .button{width:100%}
      .route-map{min-height:230px;border-radius:18px}
      .map-svg{width:84%}
      .map-caption{left:16px;right:16px;bottom:14px}
      .footer{align-items:flex-start;flex-direction:column-reverse;gap:6px}
    }

    @media(max-width:360px){
      .route-map{display:none}
      .content{padding-bottom:54px}
    }

    @media(prefers-reduced-motion:reduce){
      *{transition:none!important;scroll-behavior:auto!important}
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Axiom home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19 10.2 5h3.6L19 19h-3.4l-1-3H9.4l-1 3H5Zm5.4-6h3.2L12 8.4 10.4 13Z" fill="currentColor"></path>
          </svg>
        </span>
        <span>Axiom<span class="brand-dot">.</span></span>
      </a>
    </header>

    <main class="content">
      <section class="copy-block" aria-labelledby="page-title">
        <p class="error-code">404 · Route not found</p>
        <h1 id="page-title">This route fell out of the map.</h1>
        <p class="lead">
          The link may be old, mistyped, or moved. Your Axiom workspace is still right where you left it.
        </p>

        <div class="missing-route" title="Requested path">
          <span>Missing</span>
          <code id="missingPath">/unknown</code>
        </div>

        <nav class="actions" aria-label="Recovery options">
          <a class="button primary" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18-6-6 6-6M3 12h18"></path></svg>
            Open Axiom
          </a>
          <button class="button" id="goBack" type="button">
            Go back
          </button>
        </nav>

        <p class="status" id="routeStatus" role="status" aria-live="polite"></p>
      </section>

      <aside class="route-map" aria-label="Illustration of a disconnected route">
        <svg class="map-svg" viewBox="0 0 380 270" role="img" aria-labelledby="mapTitle mapDescription">
          <title id="mapTitle">Disconnected Axiom route</title>
          <desc id="mapDescription">A route travels from Axiom through chat and Studio before ending at a disconnected page.</desc>
          <path class="map-line active" d="M38 136h94c27 0 28-50 58-50h42"></path>
          <path class="map-line" d="M232 86h32c24 0 24 50 50 50h20"></path>
          <path class="map-line lost" d="M232 86h27c32 0 31-54 63-54h24"></path>
          <circle class="map-node active" cx="38" cy="136" r="7"></circle>
          <circle class="map-node" cx="132" cy="136" r="7"></circle>
          <circle class="map-node" cx="232" cy="86" r="7"></circle>
          <circle class="map-node" cx="334" cy="136" r="7"></circle>
          <path class="map-node lost" d="m346 19 13 13-13 13-13-13 13-13Z"></path>
          <text class="map-label strong" x="24" y="160">AXIOM</text>
          <text class="map-label" x="112" y="160">CHAT</text>
          <text class="map-label" x="211" y="70">STUDIO</text>
          <text class="map-label" x="310" y="160">BUILD</text>
          <text class="map-label strong" x="327" y="62">404</text>
        </svg>
        <div class="map-caption"><span>Workspace route</span><strong>Connection interrupted</strong></div>
      </aside>
    </main>

    <footer class="footer">
      <span>Built for Roblox developers.</span>
      <a href="https://axiomai.technology">axiomai.technology</a>
    </footer>
  </div>

  <noscript>
    <style>.status{color:var(--danger)}</style>
    <p class="status">JavaScript is off, so Axiom could not check whether this was an app route.</p>
  </noscript>

  <script>
    (()=>{
      'use strict';

      const path=location.pathname||'/';
      const missingPath=document.getElementById('missingPath');
      const routeStatus=document.getElementById('routeStatus');
      const goBack=document.getElementById('goBack');
      const appRoute=/^\/(?:chat(?:\/[^/?#]+)?|devhub|creations|messages|notifications|groups|updates)\/?$/i;
      const profileRoute=/^\/@[^/?#]+\/?$/;

      missingPath.textContent=path;
      document.title=path==='/'?'Page not found — Axiom':path+' — Not found · Axiom';

      goBack.addEventListener('click',()=>{
        const cameFromAxiom=(()=>{
          try{return document.referrer&&new URL(document.referrer).origin===location.origin;}catch{return false;}
        })();

        if(cameFromAxiom&&history.length>1)history.back();
        else location.assign('/');
      });

      async function restoreAxiomRoute(){
        if(!appRoute.test(path)&&!profileRoute.test(path))return;

        document.documentElement.dataset.routing='true';
        routeStatus.textContent='Opening this route in Axiom…';

        try{
          const response=await fetch('/index.html',{cache:'no-store',headers:{Accept:'text/html'}});
          if(!response.ok)throw new Error('Index request failed.');

          const html=await response.text();
          if(!/<html[\s>]/i.test(html)||!/<\/html>/i.test(html))throw new Error('Index response was invalid.');

          document.open('text/html','replace');
          document.write(html);
          document.close();
        }catch(error){
          document.documentElement.dataset.routing='false';
          routeStatus.textContent='Axiom could not reopen this route. Use “Open Axiom” to return home.';
          console.warn('[Axiom 404] Route recovery failed:',error);
        }
      }

      restoreAxiomRoute();
    })();
  </script>
</body>
</html>
