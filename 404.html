<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/axiom-logo.png">
  <link rel="apple-touch-icon" href="/assets/axiom-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Axiom — page not found.">
  <meta name="robots" content="noindex">
  <title>Page not found — Axiom</title>

  <style>
    @font-face{font-family:"DM Sans";src:url("/assets/fonts/dm-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 1000;font-display:swap}
    @font-face{font-family:"JetBrains Mono";src:url("/assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");font-weight:100 800;font-display:swap}

    :root{
      color-scheme:light;
      --bg:#f8fafc;
      --surface:#ffffff;
      --soft:#eef2f7;
      --ink:#172033;
      --muted:#5f6b7d;
      --line:#dde3eb;
      --blue:#2563eb;
      --blue-hover:#1d4ed8;
      --ring:#79a7ff;
      /* Globe */
      --land:#2563eb;
      --sea:#b9c4d4;
      --glow:rgba(37,99,235,.10);
    }

    @media(prefers-color-scheme:dark){
      :root{
        color-scheme:dark;
        --bg:#0e1218;
        --surface:#171d26;
        --soft:#1d2430;
        --ink:#eef2f7;
        --muted:#a0acbd;
        --line:#2b3441;
        --blue:#84adff;
        --blue-hover:#a7c5ff;
        --ring:#78a5ff;
        --land:#84adff;
        --sea:#3a4556;
        --glow:rgba(132,173,255,.12);
      }
    }

    *{box-sizing:border-box}

    html{min-width:320px;background:var(--bg)}

    body{
      margin:0;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
      font:15px/1.6 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
    }

    a,button{font:inherit;-webkit-tap-highlight-color:transparent}

    :focus-visible{outline:3px solid var(--ring);outline-offset:3px}

    .brand{
      width:max-content;
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:var(--ink);
      text-decoration:none;
      font-size:18px;
      font-weight:700;
      letter-spacing:-.4px;
    }

    .brand img{width:28px;height:28px}
    .brand em{color:var(--blue);font-style:normal}

    main{
      flex:1;
      width:min(560px,100%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 0 48px;
      text-align:center;
    }

    .globe{
      width:min(clamp(210px,38vw,300px),36dvh);
      min-width:150px;
      aspect-ratio:1;
      margin-bottom:34px;
      border-radius:50%;
      background:radial-gradient(circle at 50% 50%,var(--glow) 0 62%,transparent 71%);
      cursor:grab;
      touch-action:none;
    }

    .globe:active{cursor:grabbing}

    canvas{display:block;width:100%;height:100%}

    .code{
      margin:0 0 10px;
      color:var(--blue);
      font:600 12px/1.3 "JetBrains Mono",ui-monospace,Consolas,monospace;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:clamp(32px,6vw,46px);
      line-height:1.08;
      letter-spacing:-1.6px;
      font-weight:700;
      text-wrap:balance;
    }

    .lead{
      max-width:440px;
      margin:14px 0 0;
      color:var(--muted);
      font-size:16px;
      text-wrap:pretty;
    }

    .path{
      max-width:100%;
      margin:20px 0 0;
      padding:6px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--soft);
      color:var(--ink);
      font:500 12.5px/1.5 "JetBrains Mono",ui-monospace,Consolas,monospace;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:28px;
    }

    .button{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 18px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--surface);
      color:var(--ink);
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:background-color .15s ease,border-color .15s ease;
    }

    .button:hover{background:var(--soft)}
    .button.primary{border-color:var(--blue);background:var(--blue);color:#fff}
    .button.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
    @media(prefers-color-scheme:dark){.button.primary{color:#0e1218}}

    .status{min-height:20px;margin:16px 0 0;color:var(--muted);font-size:13px}

    footer{
      display:flex;
      justify-content:center;
      gap:18px;
      color:var(--muted);
      font-size:13px;
    }

    footer a{color:inherit;text-decoration:none}
    footer a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

    html[data-routing="true"] main{opacity:.55;pointer-events:none}

    @media(max-width:520px){
      main{padding:28px 0 36px}
      .globe{margin-bottom:26px}
      .actions{width:100%;display:grid;grid-template-columns:1fr}
      .button{width:100%}
    }

    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

<body>
  <header>
    <a class="brand" href="/" aria-label="Axiom home">
      <img src="/assets/axiom-logo.png" alt="" width="28" height="28">
      <span>Axiom<em>.</em></span>
    </a>
  </header>

  <main>
    <div class="globe" id="globe" role="img" aria-label="A dotted globe slowly spinning. Drag to turn it.">
      <canvas id="globeCanvas"></canvas>
    </div>

    <p class="code">Error 404</p>
    <h1>This page drifted off the map.</h1>
    <p class="lead">The link may be old, mistyped, or moved. Your workspace and chats are safe.</p>
    <code class="path" id="missingPath" title="Requested address">/</code>

    <nav class="actions" aria-label="Where to go next">
      <a class="button primary" href="/">Open Axiom</a>
      <button class="button" id="goBack" type="button">Go back</button>
    </nav>

    <p class="status" id="routeStatus" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="/status/">Status</a>
    <a href="/info/">About</a>
    <a href="https://discord.gg/YsfUev33kk" rel="noopener">Discord</a>
  </footer>

  <script>
    (() => {
      'use strict';

      // ── Page ────────────────────────────────────────────────────────────
      const path = location.pathname || '/';
      const routeStatus = document.getElementById('routeStatus');
      document.getElementById('missingPath').textContent = path;
      document.title = path === '/' ? 'Page not found — Axiom' : path + ' — Not found · Axiom';

      document.getElementById('goBack').addEventListener('click', () => {
        let fromAxiom = false;
        try { fromAxiom = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch {}
        if (fromAxiom && history.length > 1) history.back();
        else location.assign('/');
      });

      // On hosts without the Axiom router (e.g. GitHub Pages), app links like
      // /chat/abc land here; load the app in place so the link still works.
      const appRoute = /^\/(?:chat(?:\/[^/?#]+)?|studio|devhub|creations|messages|notifications|groups|updates|@[^/?#]+)\/?$/i;
      if (appRoute.test(path)) {
        document.documentElement.dataset.routing = 'true';
        routeStatus.textContent = 'Opening this page in Axiom…';
        fetch('/index.html', { cache: 'no-store', headers: { Accept: 'text/html' } })
          .then(response => {
            if (!response.ok) throw new Error('Index request failed.');
            return response.text();
          })
          .then(html => {
            if (!/<html[\s>]/i.test(html) || !/<\/html>/i.test(html)) throw new Error('Index response was invalid.');
            document.open('text/html', 'replace');
            document.write(html);
            document.close();
          })
          .catch(() => {
            document.documentElement.dataset.routing = 'false';
            routeStatus.textContent = 'Axiom couldn’t reopen this page. Use “Open Axiom” to go home.';
          });
      }

      // ── Globe ───────────────────────────────────────────────────────────
      const holder = document.getElementById('globe');
      const canvas = document.getElementById('globeCanvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      // Rough continent outlines as [longitude, latitude] polygons.
      const LAND = [
        [[-168,66],[-156,71],[-125,70],[-95,72],[-80,73],[-62,60],[-55,52],[-66,44],[-76,35],[-81,25],[-97,26],[-105,22],[-118,32],[-124,42],[-125,50],[-140,60],[-152,58],[-165,60]],
        [[-97,26],[-90,21],[-87,15],[-83,9],[-78,8],[-80,10],[-86,16],[-92,19],[-105,22]],
        [[-55,60],[-45,60],[-20,70],[-20,82],[-40,83],[-60,80],[-72,77]],
        [[-80,10],[-62,11],[-50,0],[-35,-6],[-40,-22],[-53,-34],[-65,-42],[-68,-54],[-74,-50],[-72,-30],[-70,-18],[-81,-5]],
        [[-10,36],[-9,43],[-2,48],[5,52],[10,58],[20,70],[32,70],[40,60],[30,46],[26,38],[12,38]],
        [[-17,21],[-10,32],[10,37],[32,31],[43,12],[51,11],[40,-12],[35,-26],[20,-35],[12,-18],[9,4],[-8,5],[-17,14]],
        [[40,60],[32,70],[70,73],[110,77],[150,70],[180,68],[165,58],[140,48],[122,30],[120,22],[108,10],[100,3],[92,22],[78,8],[68,24],[57,25],[50,30],[36,35],[30,46]],
        [[114,-22],[122,-18],[136,-12],[142,-11],[153,-26],[150,-37],[140,-38],[130,-32],[115,-34]],
        [[130,32],[135,35],[141,41],[143,44],[139,36],[132,33]],
        [[-6,50],[1,51],[-2,58],[-6,57]],
        [[44,-25],[50,-15],[49,-12],[44,-17]],
        [[95,5],[105,-6],[120,-9],[140,-8],[130,-1],[110,2]],
        [[166,-46],[174,-41],[178,-38],[172,-35],[168,-44]]
      ];

      function onLand(lon, lat) {
        for (const poly of LAND) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const [xi, yi] = poly[i], [xj, yj] = poly[j];
            if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
          }
          if (inside) return true;
        }
        return lat < -72; // Antarctica
      }

      // Evenly spread dots over the sphere (Fibonacci lattice).
      const COUNT = 1800;
      const dots = [];
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < COUNT; i++) {
        const y = 1 - (i / (COUNT - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = golden * i;
        const x = Math.cos(theta) * r, z = Math.sin(theta) * r;
        const lat = Math.asin(y) * 180 / Math.PI;
        const lon = Math.atan2(x, z) * 180 / Math.PI;
        dots.push({ x, y, z, land: onLand(lon, lat) });
      }

      const TILT = 18 * Math.PI / 180;
      const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
      let angle = 0.6;          // current spin (radians)
      let velocity = 0;         // extra spin from dragging
      const SPIN = 0.18;        // radians per second
      let colors = {};
      let size = 0, dpr = 1;

      function readColors() {
        const css = getComputedStyle(document.documentElement);
        colors = { land: css.getPropertyValue('--land').trim(), sea: css.getPropertyValue('--sea').trim(), line: css.getPropertyValue('--line').trim() };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        size = holder.clientWidth;
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        draw();
      }

      function draw() {
        const S = size * dpr, R = S * 0.46, c = S / 2;
        ctx.clearRect(0, 0, S, S);

        // Rim
        ctx.beginPath();
        ctx.arc(c, c, R, 0, Math.PI * 2);
        ctx.strokeStyle = colors.line;
        ctx.lineWidth = dpr;
        ctx.stroke();

        const cosA = Math.cos(angle), sinA = Math.sin(angle);
        const unit = R / 150;
        for (const d of dots) {
          // Spin around the pole, then tilt toward the viewer.
          const x = d.x * cosA + d.z * sinA;
          const z1 = -d.x * sinA + d.z * cosA;
          const y = d.y * cosT - z1 * sinT;
          const z = d.y * sinT + z1 * cosT;
          if (z < 0) continue; // far side hidden

          // Dots near the edge are smaller and fainter, which reads as depth.
          const depth = 0.35 + 0.65 * z;
          ctx.globalAlpha = d.land ? depth : depth * 0.55;
          ctx.fillStyle = d.land ? colors.land : colors.sea;
          ctx.beginPath();
          ctx.arc(c + x * R, c - y * R, (d.land ? 2.3 : 1.2) * unit * (0.6 + 0.4 * z), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // Drag to turn the globe; it eases back to its normal spin.
      let dragging = false, lastX = 0, lastT = 0;
      holder.addEventListener('pointerdown', event => {
        dragging = true; lastX = event.clientX; lastT = performance.now();
        holder.setPointerCapture(event.pointerId);
      });
      holder.addEventListener('pointermove', event => {
        if (!dragging) return;
        const now = performance.now();
        const delta = (event.clientX - lastX) / size * Math.PI;
        angle += delta;
        velocity = delta / Math.max(16, now - lastT) * 1000;
        lastX = event.clientX; lastT = now;
        draw();
      });
      const release = () => { dragging = false; };
      holder.addEventListener('pointerup', release);
      holder.addEventListener('pointercancel', release);

      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let last = performance.now(), frame = 0;
      function tick(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (!dragging) {
          angle += (SPIN + velocity) * dt;
          velocity *= Math.pow(0.04, dt);
          draw();
        }
        frame = requestAnimationFrame(tick);
      }
      function start() {
        cancelAnimationFrame(frame);
        if (reduced.matches || document.hidden) { draw(); return; }
        last = performance.now();
        frame = requestAnimationFrame(tick);
      }

      readColors();
      resize();
      start();
      new ResizeObserver(resize).observe(holder);
      reduced.addEventListener('change', start);
      document.addEventListener('visibilitychange', start);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); draw(); });
    })();
  </script>
</body>
</html>
