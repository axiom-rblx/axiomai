<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a0c" />
<title>Axiom — Maintenance</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0c;
    color: #ededed;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: min(420px, 100%);
    text-align: center;
  }

  .logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    margin: 0 auto 36px;
    display: block;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: #fafafa;
  }

  p {
    margin: 10px auto 0;
    max-width: 340px;
    color: #888;
    font-size: 14px;
    line-height: 1.6;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 28px;
    padding: 6px 12px;
    border: 1px solid #1f1f22;
    border-radius: 6px;
    background: #131315;
    color: #999;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f5a524;
  }

  .footer {
    margin-top: 40px;
    font-size: 12.5px;
    color: #555;
  }

  .footer a {
    color: #777;
    text-decoration: none;
    border-bottom: 1px solid #2a2a2d;
    transition: color .15s ease, border-color .15s ease;
  }

  .footer a:hover {
    color: #ededed;
    border-color: #555;
  }
</style>
</head>

<body>
  <main class="wrap">
    <img class="logo" src="content.png" alt="Axiom" />

    <h1>We're currently down for maintenance</h1>
    <p>We're deploying some updates and will be back shortly. Thanks for bearing with us.</p>

    <div class="status">
      <span class="dot"></span>
      In progress
    </div>

    <div class="footer">
      <a href="https://axiomai.technology/status/">https://axiomai.technology/status/</a>
    </div>
  </main>
</body>
</html>
